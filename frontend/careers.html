<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Career Paths — CareerAI</title>
  <meta name="description" content="Explore 17+ career paths with detailed skill requirements, salary ranges, and growth projections."/>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>"/>
  <link rel="stylesheet" href="/css/variables.css"/>
  <link rel="stylesheet" href="/css/global.css"/>
  <link rel="stylesheet" href="/css/components.css"/>
  <link rel="stylesheet" href="/css/careers.css"/>
  <link rel="stylesheet" href="/css/responsive.css"/>
</head>
<body>
<div id="toast-container" class="toast-container"></div>

<div class="app-layout">
  <main class="main-content">
    <div class="page-content">

      <div class="page-header fade-in">
        <h1>Career Paths</h1>
        <p>Explore in-demand careers with skill requirements, salary data, and personalized gap analysis.</p>
      </div>

      <!-- Search -->
      <div class="card mb-6 fade-in" style="padding:14px 18px">
        <div class="flex gap-3 items-center">
          <span style="font-size:1.1rem">🔍</span>
          <input type="text" id="career-search" class="form-input" placeholder="Search careers, skills, or technologies…" style="border:none;background:transparent;box-shadow:none;padding:0;font-size:0.95rem"/>
        </div>
      </div>

      <!-- Loading -->
      <div id="careers-loading" class="page-loading hidden">
        <div class="spinner"></div> Loading career paths…
      </div>

      <!-- Grid -->
      <div id="careers-grid" class="careers-grid fade-in"></div>

    </div>
  </main>
</div>

<script src="/js/api.js"></script>
<script src="/js/utils.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/careers.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    layout.init('careers', 'Career Paths', 'Explore opportunities that match your skills');
  });
</script>
</body>
</html>
